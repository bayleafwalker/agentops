[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "operator-projection"
version = "0.2.4"
description = "operator-projection/v1: a derived, read-only operator front page"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pyyaml>=6",
    # Published v0.1.2 wheel, immutable URL plus verified digest.
    # Absent (Python 3.11) means the authority panels render BLIND.
    "vuoro-client @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-client-v0.1.2/vuoro_client-0.1.2-py3-none-any.whl#sha256=7a4f32d4e2531a1abc99f5dc017fb8f6f22c4a1ef191079b98808be897081660 ; python_version >= '3.12'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
operator-projection = "operator_projection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "p0"]
pythonpath = ["src"]
