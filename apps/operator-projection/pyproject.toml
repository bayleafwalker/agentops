[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "operator-projection"
version = "0.1.1"
description = "operator-projection/v1: a derived, read-only operator front page"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pyyaml>=6",
    # Pinned exactly as sprintctl/pyproject.toml pins it: the attested GitHub Release wheel,
    # immutable URL plus verified digest. Absent (Python 3.11) means the authority panels render BLIND.
    "vuoro-client @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-client-v0.1.0/vuoro_client-0.1.0-py3-none-any.whl#sha256=d94c35002d94dec2ac86c75a2693934c67d2c72c8d27b2048836ed4e1d1c71db ; python_version >= '3.12'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
operator-projection = "operator_projection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "p0"]
pythonpath = ["src"]
