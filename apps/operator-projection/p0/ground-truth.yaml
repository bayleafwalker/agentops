#   deployment/ks history, and the ghcr tag→digest map. That map corrects MOVES.md again:
#   6269a2fc rolled v0.1.10 (V09 said "never rolled separately").
# - Classes are the dossier's mechanical ones (§6.3), not MOVES.md's: a repin is
#   CONTRACT-CHANGE, never GAINED; a restore after a REGRESSED is GAINED.
# - Where the author's belief about meaning differs from what a literal reading of the config
#   shape would give, the belief is recorded and marked `belief:`. Those rows are the test.
# - The author did not run any replay before committing this file.
#
# Scoring (pre-registered):
# - A move GROUP is (vocabulary, boundary, class). Primary metric: group recall and precision
#   over scored vocabularies. Gate: recall >= 0.9 and precision >= 0.8.
# - Secondary: member agreement per matched group (exact member set, or count where `members: "*"`).
# - boundary = appservice commit on origin/main (the Flux-watched branch), 8-hex prefix.
# - Window: committer date 2026-07-15T00:00Z <= t < 2026-09-14T00:00Z. State at window start is
#   evaluated at the last appservice commit before it.
# - Member identity for locks: vuoro-composition/v1 `adapters[].domain` X == v2/v3 `lock_id` "X-adapter".
# - Rows with `scored: false` are printed as coverage gaps or expected hazards and never counted.

