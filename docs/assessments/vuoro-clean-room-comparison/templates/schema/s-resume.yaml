schema_version: vuoro-clean-room-comparison.scenario.v1
scenario_code: S-RESUME
scenario_name: cold resume after idle period
capture_shape:
  description: >
    Resume partially completed work with no prior conversation context after a
    recorded idle gap. Measure state identification, conflict visibility,
    reconstruction burden, and the first confident next action.
  boundaries_tested:
    - R1
    - R2
    - R3
    - R4
    - R6
    - R8
  required_horizon: cold-resume
required_inputs:
  - idle_duration
  - session_shape
  - repository
  - task_id
  - resume_surface
  - resume_started_at
  - first_confident_action_at
  - conflicts_or_blockers
  - other_sources_consulted
  - ambiguity_remaining
  - authored_note_effect
event_columns:
  - event_id
  - boundary
  - event_timestamp
  - event_name
  - prevented_or_recorded
  - time_to_confident_action_seconds
  - manual_reconstruction_band
  - operator_decision_impact
  - raw_evidence_links
entry_template:
  event_id: EVT-001
  boundary: R3
  event_timestamp: 2026-07-XX-XXT00:00:00Z
  event_name: cold resume to first safe next action
  prevented_or_recorded: prevented|recorded|not-applicable
  time_to_confident_action_seconds: todo
  manual_reconstruction_band: under-5m|5-15m|15-60m|1-4h|over-4h|not-measured
  operator_decision_impact: high|medium|low|none
  raw_evidence_links:
    - docs/assessments/vuoro-pre-clean-room/08-resume-observations.md
    - docs/assessments/vuoro-pre-clean-room/06-reduced-workflow-specification.md
