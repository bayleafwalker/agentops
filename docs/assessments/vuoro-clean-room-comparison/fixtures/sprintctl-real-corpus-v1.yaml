common_acceptance_command: >-
  python -m pytest -q -p no:cacheprovider <the selected node ids>; candidate
  adapters may add their own isolated checks but may not replace these.
controls:
  worktree: one disposable clone per lane
  production_credentials: forbidden
  production_mutation: forbidden
  agent_workers: 10 logical actors named worker-01 through worker-10
  secret_evidence: proof values are represented only by sha256 digest
limitations: >-
  This corpus supplies real claim, resume, and authority test obligations. It
  does not by itself model a production unattended agent run, so R5 execution
  substitutions still need their dedicated duplicate-delivery sandbox probe.
