schema_version: vuoro-clean-room-comparison.disposition.v1
artifact_type: boundary_disposition_sheet
boundaries:
  - id: R1
    name: work registry
    baseline_reference:
      requirement: docs/assessments/vuoro-pre-clean-room/06-reduced-workflow-specification.md
    lane_dispositions:
      - lane_id: B
        disposition: baseline|buy|wrap|remove|keep-bespoke|keep-bespoke-current
        satisfies_threshold_rule:
          remove: >
            lane B/S-SIMPLIFY passes hard gates, succeeds in >=90%, adds <=20%
            operator overhead, and no trust/regression
          buy: >
            passes hard gates, matches or improves Lane B, lowers carrying cost by
            >=30%, no broad adapters/forks, credible rollback path
          wrap: >
            commodity externalizes routine work while adapter remains smaller than
            displaced implementation, authority unambiguous, reconciliation decreases
          keep: >
            reduced lane materially outperforms baseline at this boundary
        confidence: low|medium|high|not-assessed
        evidence_links: []
        reversal_condition: >
          one-sentence condition under which this boundary decision must be revisited
  - id: R2
    name: exclusive claims and transferable proof
    baseline_reference:
