meta:
  thresholds:
    remove: >
      Lane 0 / S-SIMPLIFY passes hard gates, succeeds in >=90% of relevant
      scenarios, adds <=20% operator time versus baseline, no trust regression.
    buy: >
      passes hard gates, matches or improves Lane B outcome quality, lowers
      expected carrying cost by >=30%, adapter/fork <= one-third, credible rollback.
    wrap: >
      commodity externalized, adapter stable and smaller than displaced
      implementation, authority unambiguous, reconciliation decreases.
    keep_bespoke_reduced: >
      reduced baseline materially outperforms, externals fail hard gates or need
      broad adaptation.
    keep_bespoke_current: >
      difficult outcome requiring clear proof of materially better operational
      and maintenance posture versus reduced variant.
