schema_version: vuoro-clean-room-comparison.cost.v1
artifact_type: segmented_horizon_cost_inputs
status: not-measured-no-synthetic-costs
collection_rule: >-
  The frozen experiment requires scenario-segmented operator, agent, and
  failure data. The completed probes were component litmuses, not comparable
  ten-worker scenario runs, so no numeric adoption, carrying, or per-workflow
  cost is valid.
lane_cost_status:
  B: baseline corpus acceptance only; no cost instrumentation
  '0': non-comparable discovery; excluded
  '1': R2 failure before cost study
  '2': adapter R2 litmus and integrated mutation-boundary exclusion; no comparable adaptation, fork, or cost study
  '3': R5/R6 failure as executed before cost study
  '4': reference spike only; not a migration candidate
cost_segments:
  adoption_horizon: not-measured
  monthly_carrying_horizon: not-measured
  per_workflow_cost:
    S-SOLO: not-measured
    S-RESUME: not-measured
    S-BATCH: not-measured
    interrupted_execution: not-measured
    unattended_run: not-measured
normalization:
  scenario_not_to_be_averaged: true
  compute_per_boundary: true
  compute_per_lane: true
evidence_links:
  - outputs/hard-gate-r2-r6-verdict.yaml
  - runs/README.md
