    Current bespoke production and test Python owned by the Vuoro transport and
    service shell plus Sprintctl work authority. AgentOps cockpit, ActionQ,
    Kctl, Auditctl, Appservice deployment overlays, generated files, vendored
    code, documentation, and external dependencies are excluded. Their
    operational effects must still be counted by a candidate run when touched.
  baseline_revisions:
    vuoro: 10e0db963002a6616c4995de5004c4f9ac7f945d
    sprintctl: 8c53621d622435a7efc4a39e525dd0b20ce993cc
  concurrent_work_excluded:
    repository: vuoro
    item: vuoro#2126
    branch: codex/vuoro-2126-release-contracts-20260811b
    reason: active devbox feature-enablement claim was not merged into the pinned baseline

counting_contract:
  line_metric: physical tracked lines, equivalent to Python splitlines()
  nonblank_metric: tracked lines whose stripped value is non-empty
  module_metric: tracked Python files
  generated_files: excluded
  vendored_files: excluded
  reproduction: >-
    At each pinned revision, enumerate tracked files with git ls-files, retain
    .py files under the named roots, and sum splitlines() and non-empty
    splitlines(). Test roots are counted separately and never presented as
    displaced production logic.

