post_1164_structural_entry:
  repository: sprintctl
  revision: 52a0620
  title: retire direct remote normal client
  interpretation: >-
    The commit removed normal direct-PostgreSQL client behavior and retained
    named migration, recovery, and circuit-breaker paths. It is a semantic
    reduction, but not a production-Python line reduction. Do not count the
    whole-commit net deletion as displaced authority logic.
  whole_commit:
    files_changed: 9
    insertions: 209
    deletions: 369
    net_physical_lines: -160
  production_python:
    modules_before: 37
    modules_after: 37
    physical_lines_before: 30920
    physical_lines_after: 30941
    net_physical_lines: 21
    nonblank_lines_before: 27937
    nonblank_lines_after: 27956
    net_nonblank_lines: 19
  evidence:
    - sprintctl@52a0620
    - sprintctl/docs/guides/remote-mode.md
    - sprintctl/verification/contexts/direct-remote-circuit-breaker.json

authority_and_operations:
  authoritative_mutation_paths:
    count: 1
    entries:
      - owner: Sprintctl work application
        store: deployment-owned PostgreSQL for shared served work
        path: Vuoro catalog transport to released Sprintctl adapter
        evidence:
          - sprintctl/docs/reference/vuoro-work-adapter.md
          - sprintctl/docs/guides/remote-mode.md
    qualifications:
      - Local SQLite is a separate standalone or explicitly restored recovery authority, not a simultaneous normal shared-write path.
      - Named migration and recovery commands may receive direct database credentials; normal served clients may not.
  authoritative_databases:
    normal_shared_operation:
      count: 1
      entries:
        - owner: Sprintctl
          engine: PostgreSQL
          purpose: shared work, claims, events, and capability state
          evidence: sprintctl/docs/reference/postgres-schema-compatibility.md
    supported_modes_including_recovery:
      count: 2
      entries:
        - owner: Sprintctl
          engine: PostgreSQL
          purpose: shared served authority
        - owner: Sprintctl
          engine: SQLite
          purpose: standalone local or explicit recovery authority
  reconciliation_loops:
    normal_shared_operation_count: 0
    retained_operator_paths:
      - id: authority-reconcile
        direction: served authority record and decision ledgers to local outbox repair
        automatic: false
        evidence: sprintctl/docs/guides/authority-commands.md
      - id: recover-from-remote
        direction: PostgreSQL snapshot to ownership-invalidating SQLite recovery database
        automatic: false
        evidence: sprintctl/docs/guides/remote-mode.md
  independently_upgraded_services:
    minimum_runtime_count: 2
    entries:
      - service: Vuoro service shell
        owner: Vuoro
        release_unit: vuoro-service artifact/image
        evidence: vuoro/docs/architecture/packaging.md
      - service: Sprintctl work adapter
        owner: Sprintctl
        release_unit: pinned Sprintctl package consumed by service composition
        evidence: sprintctl/docs/reference/vuoro-work-adapter.md
    deployment_owner_excluded_but_required: Appservice owns database, identities, migrations, and rollout.
  upstream_patch_burden:
    kind: none
    rationale: Baseline is entirely project-owned code; no maintained third-party fork is part of the measured surface.
  procedures:
    migration:
      summary: Appservice migration role runs the pinned Sprintctl migration package under a global advisory lock; runtime startup is read-only compatibility checking.
      evidence: sprintctl/docs/reference/postgres-schema-compatibility.md
    rollback:
      summary: Roll back the compatible service/adapter release and use retained exports; no implicit dual-write path exists.
      evidence:
        - sprintctl/docs/guides/remote-mode.md
        - docs/plans/clean-room-1164-cross-repo-backlog.md
    recovery:
      summary: An explicit read-only PostgreSQL export creates a new SQLite recovery authority with claims closed and proof tokens stripped.
      evidence: sprintctl/docs/guides/remote-mode.md

