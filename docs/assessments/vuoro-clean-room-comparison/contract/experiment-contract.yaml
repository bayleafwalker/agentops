artifact_type: immutable_experiment_contract
contract_id: vuoro-clean-room-2026-07-23
status: frozen
frozen_at: 2026-07-23T00:00:00Z
freeze_rule: >-
  R1-R8 wording, hard gates, pre-registered thresholds, scenario definitions,
  controls, and H8 weights are immutable for this comparison. A correction
  requires a new contract id, a stated procedural error, and does not alter the
  frozen requirement sources.

