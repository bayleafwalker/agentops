name: Publish operator-projection wheel

on:
  push:
    tags:
      - "operator-projection-v*"

permissions:
  attestations: write
  artifact-metadata: write
  contents: write
  id-token: write

concurrency:
  group: operator-projection-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - name: Require the exact package tag on canonical main
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^operator-projection-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]] || exit 1
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$GITHUB_SHA" ]] || exit 1
          [[ "$(git rev-parse refs/remotes/origin/main)" == "$GITHUB_SHA" ]] || {
            echo "tag does not name current canonical main" >&2; exit 1;
          }
          version="$(python3 apps/operator-projection/checks/validate_release.py --tag "$RELEASE_TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the locked distribution and test dependencies
        run: uv sync --extra dev --locked
        working-directory: apps/operator-projection
      - name: Run the complete distribution suite
        run: uv run --extra dev pytest -q
        working-directory: apps/operator-projection
      - name: Build the one existing operator-projection wheel
        run: uv build --wheel --out-dir dist/publish
        working-directory: apps/operator-projection
      - name: Validate candidate bytes and write checksum
        id: artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          wheel_name="operator_projection-${RELEASE_VERSION}-py3-none-any.whl"
          wheel="apps/operator-projection/dist/publish/$wheel_name"
          shopt -s nullglob
          wheels=(apps/operator-projection/dist/publish/*.whl)
          [[ "${#wheels[@]}" -eq 1 && -f "$wheel" ]] || exit 1
          python3 apps/operator-projection/checks/validate_release.py --tag "$RELEASE_TAG" --wheel "$wheel"
          (cd apps/operator-projection/dist/publish && sha256sum "$wheel_name" > "$wheel_name.sha256")
          echo "wheel=$wheel" >> "$GITHUB_OUTPUT"
          echo "wheel_name=$wheel_name" >> "$GITHUB_OUTPUT"
          echo "checksum=${wheel}.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$wheel" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Attest the gated wheel
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.wheel }}
      - name: Create a draft release for only this distribution
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          WHEEL: ${{ steps.artifact.outputs.wheel }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
          WHEEL_NAME: ${{ steps.artifact.outputs.wheel_name }}
          WHEEL_SHA256: ${{ steps.artifact.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          notes=$(printf 'tag: %s\ndistribution: operator-projection\nwheel: %s\nsha256: %s\n' \
            "$RELEASE_TAG" "$WHEEL_NAME" "$WHEEL_SHA256")
          gh release create "$RELEASE_TAG" --verify-tag --repo "$GITHUB_REPOSITORY" \
            --draft --latest=false --title "$RELEASE_TAG — $WHEEL_NAME — sha256:$WHEEL_SHA256" \
            --notes "$notes" "$WHEEL" "$CHECKSUM"
      - name: Read back wheel, checksum and provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          WHEEL: ${{ steps.artifact.outputs.wheel }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
          WHEEL_NAME: ${{ steps.artifact.outputs.wheel_name }}
        shell: bash
        run: |
          set -euo pipefail
          readback="$RUNNER_TEMP/operator-projection-release-readback"
          mkdir -p "$readback"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$WHEEL_NAME" --pattern "$WHEEL_NAME.sha256" --dir "$readback"
          cmp -- "$WHEEL" "$readback/$WHEEL_NAME"
          cmp -- "$CHECKSUM" "$readback/$WHEEL_NAME.sha256"
          (cd "$readback" && sha256sum -c "$WHEEL_NAME.sha256")
          gh attestation verify "$readback/$WHEEL_NAME" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-operator-projection.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
