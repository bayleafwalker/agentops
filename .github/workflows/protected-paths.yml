name: protected paths

# The dispatch gate asserts protected-paths-untouched over the worker's commit;
# acceptance happens over the merged PR. This closes that gap for every PR, at
# no cost in coordinator time.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  protected-paths:
    runs-on: ubuntu-latest
    steps:
      # Trust boundary: the checker and the protected-path list (the manifest)
      # come from the BASE commit, so a PR cannot rewrite the gate that judges
      # it. The PR head is fetched as git objects (data) only; it is never
      # checked out and nothing from it is executed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: fetch PR head as data
        run: git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"
      - name: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          python3 scripts/check_protected_paths.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --title "$PR_TITLE" \
            --sender "$SENDER"

  templates-dispatch-allowlist:
    # S2 item 6: templates/dispatch was deleted in full (PR-E, then PR-B for
    # the held-back hooks/ subtree). This fails a PR that grows a fresh
    # reference to the deleted tree outside the allowlist in
    # scripts/templates_dispatch_allowlist.txt.
    # Script and allowlist come from BASE; the PR head tree is checked out
    # into head/ purely as data to grep, and nothing in it is executed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - name: check
        run: |
          python3 base/scripts/check_templates_dispatch_allowlist.py \
            --root head \
            --allowlist base/scripts/templates_dispatch_allowlist.txt

  append-only-shards:
    # TS-6: committed auditctl shards are authoritative evidence until the S4
    # evidence-home migration. Fails a PR that rewrites rather than appends to
    # a committed shard under _artifacts/**/audit/**.
    # Same trust boundary as protected-paths: base checkout runs the script,
    # the PR head is fetched as data only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: fetch PR head as data
        run: git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"
      - name: check
        run: |
          python3 scripts/check_append_only_shards.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
