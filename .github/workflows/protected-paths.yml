name: protected paths

# The dispatch gate asserts protected-paths-untouched over the worker's commit;
# acceptance happens over the merged PR. This closes that gap for every PR, at
# no cost in coordinator time.
#
# Trust boundary. pull_request_target workflows are read from the BASE branch,
# so a PR cannot rewrite this file to pass. Because the token context is
# privileged, NOTHING from the PR head is ever executed: scripts and the
# protected-path manifest come from the base sha; the head is only fetched as
# git objects (or checked out into head/ as data to grep).
#
# TEMPORARY BOOTSTRAP: the `pull_request` trigger below exists only so the PR
# that introduces pull_request_target gets meaningful checks (main's old
# workflow is the one that runs for it). A follow-up PR must delete the
# `pull_request` trigger and the --sender probe in the protected-paths job.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  pull_request:  # TEMPORARY BOOTSTRAP, remove in the follow-up PR
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  protected-paths:
    runs-on: ubuntu-latest
    steps:
      # Trust boundary: the checker and the protected-path list (the manifest)
      # come from the BASE commit, so a PR cannot rewrite the gate that judges
      # it. The PR head is fetched as git objects (data) only; it is never
      # checked out and nothing from it is executed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: fetch PR head as data
        run: git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"
      - name: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          # a base checker that predates --sender cannot be passed it.
          # TEMPORARY BOOTSTRAP: the base script is trusted, so this probe cannot
          # be steered by the PR; remove with the pull_request trigger.
          sender_args=()
          if grep -q -- '--sender' scripts/check_protected_paths.py; then
            sender_args=(--sender "$SENDER")
          fi
          python3 scripts/check_protected_paths.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --title "$PR_TITLE" \
            "${sender_args[@]}"

  templates-dispatch-allowlist:
    # S2 item 6: templates/dispatch was deleted in full (PR-E, then PR-B for
    # the held-back hooks/ subtree). This fails a PR that grows a fresh
    # reference to the deleted tree outside the allowlist in
    # scripts/templates_dispatch_allowlist.txt.
    # Script and allowlist come from BASE; the PR head tree is checked out
    # into head/ purely as data to grep, and nothing in it is executed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - name: check
        run: |
          python3 base/scripts/check_templates_dispatch_allowlist.py \
            --root head \
            --allowlist base/scripts/templates_dispatch_allowlist.txt

  append-only-shards:
    # TS-6: committed auditctl shards are authoritative evidence until the S4
    # evidence-home migration. Fails a PR that rewrites rather than appends to
    # a committed shard under _artifacts/**/audit/**.
    # Same trust boundary as protected-paths: base checkout runs the script,
    # the PR head is fetched as data only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: fetch PR head as data
        run: git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"
      - name: check
        run: |
          python3 scripts/check_append_only_shards.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
