# Canonical vuoro project binding.
# project_id is registered in agentops.toml and is immutable.

schema_version = 1
project_id = "981b2073-d7af-4c28-bff3-3cf807495fba"
display_name = "vuoro"
home_repo = "agentops"

# Model/behavior presets are descriptive dispatch defaults only. They never
# grant repository, queue, release, or deployment authority.
[role_presets.planner]
model = "Sol"
behavior = "xhigh"
tool_mode = "read-only"

[role_presets.worker]
model = "Luna"
behavior = "high"
tool_mode = "write"

[role_presets.reviewer]
model = "Sol"
behavior = "xhigh"
tool_mode = "read-only"

[[members]]
repo_id = "agentops"
backlog = true
render = "none"
relationship = "governance"
access = "write"
repository = "https://github.com/bayleafwalker/agentops.git"
default_ref = "refs/heads/main"
path_notes = [
  "Home repo: hosts sprintctl backlog #380 and project render sources.",
  "The agent-cockpit operator UI is apps/web in this repository, not a separate member.",
]

[[members]]
repo_id = "vuoro"
backlog = true
render = "full"
relationship = "implementation"
access = "write"
repository = "https://github.com/bayleafwalker/vuoro.git"
default_ref = "refs/heads/main"
path_notes = [
  "Public runtime repository: owns the transport-only client and modular service shell.",
  "Agent execution and session behavior remain at the selected native harness/runtime boundary; Vuoro does not schedule or supervise them.",
  "Appservice remains the private deployment authority for development and production overlays.",
]

[[members]]
repo_id = "sprintctl"
backlog = true
render = "full"
relationship = "planning-authority"
access = "write"
repository = "https://github.com/bayleafwalker/sprintctl.git"
default_ref = "refs/heads/main"
path_notes = [
  "Owns sprint/work-item state, revisions, dependencies, notes, and advisory reservations.",
  "Reservations expose overlap and grant no capability; expected-revision compare-and-swap protects mutations.",
]

[[members]]
repo_id = "kctl"
backlog = true
render = "full"
relationship = "tooling"
access = "write"
repository = "https://github.com/bayleafwalker/kctl.git"
default_ref = "refs/heads/main"

[[members]]
repo_id = "auditctl"
backlog = true
render = "full"
relationship = "tooling"
access = "write"
repository = "https://github.com/bayleafwalker/auditctl.git"
default_ref = "refs/heads/main"
path_notes = [
  "Owns the repo-local audit index, durable NDJSON evidence shards, and rebuild semantics.",
]

[[members]]
repo_id = "actionq"
backlog = true
render = "full"
relationship = "reference"
access = "write"
repository = "https://github.com/bayleafwalker/actionq.git"
default_ref = "refs/heads/main"
path_notes = [
  "Target owner for federated work/execution identities, relations, external execution references, assurance, evidence requirements, acceptance, settlement, and reconciliation.",
  "Native harnesses/runtimes execute work; ActionQ must not own worktrees, harness invocation, leases, fan-out, or Sprintctl reservation coordination.",
  "ActionQ 0.1.26 removed its daemon, harness adapters, worktree/session execution plane, and standalone server source; the retained queue and Vuoro adapter are the extraction boundary for the federation transition.",
  "Running server/daemon residue is not a source feature and is not assumed retired until the separately authorized appservice and devbox rollout gates are evidenced.",
]

[[members]]
repo_id = "actionq-dispatcher"
backlog = false
render = "none"
relationship = "reference"
access = "reference"
repository = "https://github.com/bayleafwalker/actionq-dispatch.git"
default_ref = "refs/heads/main"
path_notes = [
  "Inactive retirement tombstone at actionq-dispatcher-v0.2.0; dispatcher-once always fails with an actionable retirement message and performs no queue or process work.",
  "Do not install or schedule it for new work. Existing installations may upgrade once to replace a stale launcher, then remove it after operator-owned callers and services are retired.",
]
