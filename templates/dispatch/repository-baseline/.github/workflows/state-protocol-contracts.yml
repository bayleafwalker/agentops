name: State protocol contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bayleafwalker/agentops
          path: .agentops-contracts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate dispatch and verification contracts
        run: >-
          python .agentops-contracts/templates/dispatch/scripts/validate_verification_artifacts.py
          --root .
